<label *ngIf="grafica">{{grafica.name}}</label>
<div style="width: 100%; min-width: 100%; height: 500px;">
    <div *ngIf="options" #chartContainer style="height:100%;min-width: 100%;"></div>
</div>
<table class="tablaTooltip" *ngIf="detailTable">
    <thead>
        <th *ngFor="let key of getKeys(tooltipData[0])">
            {{ formatKey(key) }}
          </th>
    </thead>
    <tbody>
        <tr *ngFor="let punto of tooltipData">
            <td *ngFor="let key of getKeys(punto)">
                {{ punto[key] }} 
              </td>
        </tr>
    </tbody>
</table>
<style>
    .tablaTooltip {
        width: auto;
        font-size: 10px;
        border-collapse: collapse;
        margin-top: 10px;
    }

    .tablaTooltip th,
    .tablaTooltip td {
        border: 1px solid #ddd;
        padding: 2px 4px;
        text-align: left;
        font-weight: normal !important;
    }

    .tablaTooltip th {
        background-color: #f8f8f8;
        font-weight: 600;
    }

    .tablaTooltip td {
        background-color: #fff;
    }

    .tablaTooltip tr:nth-child(even) td {
        background-color: #f4f4f4;
    }
</style>
<hr>
